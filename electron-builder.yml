appId: com.javierroman.dropcount
productName: Drop Count
directories:
  output: release
files:
  - out/**/*
  - package.json
mac:
  category: public.app-category.music
  target:
    - target: dmg
      arch:
        - arm64
        - x64
win:
  target:
    - target: nsis
      arch:
        - x64
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Audio
